<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>티라노 디자인 시안</title>
<style>
html,body{margin:0;height:100%;background:#0b1710}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100vw;max-height:100vh}
</style>
</head>
<body>
<canvas id="c" width="1600" height="1000"></canvas>
<script>
// ===== 티라노사우루스 디자인 시안: 사실적 피부 질감 + 입체 음영 (Canvas 2D, 사파리 호환 기법만 사용) =====
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), CW = cv.width, CH = cv.height;
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 피부 텍스처: 자갈 같은 비늘 + 큰 돌기 + 주름 (회색 = overlay 합성용) ----------
function makeSkin(size, cell, seed) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), R = rng(seed);
  g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, size, size);
  const draw = (x, y, r, rot, sq) => {
    for (const dx of [-size, 0, size]) for (const dy of [-size, 0, size]) {
      const px = x + dx, py = y + dy; if (px < -r || px > size + r || py < -r || py > size + r) continue;
      const gr = g.createRadialGradient(px - r * 0.35, py - r * 0.45, r * 0.05, px, py, r);
      gr.addColorStop(0, 'rgb(178,178,178)'); gr.addColorStop(0.5, 'rgb(140,140,140)'); gr.addColorStop(0.85, 'rgb(106,106,106)'); gr.addColorStop(1, 'rgb(88,88,88)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(px, py, r, r * sq, rot, 0, 7); g.fill();
    }
  };
  const n = Math.round(size / cell), step = size / n;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++)
    draw((i + 0.5 + (j % 2 ? 0.5 : 0)) * step + (R() - 0.5) * step * 0.45, (j + 0.5) * step + (R() - 0.5) * step * 0.45, step * (0.42 + R() * 0.16), R() * 3, 0.72 + R() * 0.22);
  for (let k = 0; k < n * n * 0.035; k++) draw(R() * size, R() * size, step * (0.75 + R() * 0.5), R() * 3, 0.8);
  g.lineCap = 'round';
  for (let k = 0; k < n * 0.9; k++) {
    const x = R() * size, y = R() * size, l = step * (3 + R() * 6), a = (R() - 0.5) * 0.8;
    g.strokeStyle = 'rgba(50,50,50,.45)'; g.lineWidth = step * 0.18;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5, y + Math.sin(a) * l * 0.5 + step, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  return ctx.createPattern(c, 'repeat');
}
const SKIN = makeSkin(512, 9, 7), SKIN_FINE = makeSkin(256, 7, 3);

// ---------- 칠하기 도우미 ----------
// 안쪽 그림자: 모양 바깥 영역의 그림자만 안으로 번지게 해서 둥근 입체감/가장자리 어둠을 만든다
function innerShadow(pathFn, blur, color, ox, oy) {
  ctx.save(); ctx.beginPath(); pathFn(); ctx.clip();
  ctx.beginPath(); ctx.rect(-4000, -4000, 8000, 8000); pathFn();
  const m = ctx.getTransform(), k = Math.hypot(m.a, m.b) * 0.4; // 그림자 값은 화면 픽셀 기준이라 확대 배율에 맞춰 조정
  ctx.shadowColor = color; ctx.shadowBlur = blur * k; ctx.shadowOffsetX = ox * k; ctx.shadowOffsetY = oy * k;
  ctx.fillStyle = '#000'; ctx.fill('evenodd'); ctx.restore();
}
function glow(x, y, rx, ry, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, col); g.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill(); ctx.restore();
}
// 몸 한 부위: 등-옆-배 3단 색 → 볼륨 하이라이트 → 비늘 질감 → 무늬 → 바닥 쪽 그림자 → 위쪽 림라이트 → 얇은 윤곽
function part(pathFn, o) {
  ctx.save(); ctx.beginPath(); pathFn();
  const g = ctx.createLinearGradient(0, o.y0, 0, o.y1);
  o.cols.forEach((c, i) => g.addColorStop(i / (o.cols.length - 1), c));
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  (o.hl || []).forEach(h => glow(h[0], h[1], h[2], h[3], `rgba(255,205,150,${h[4]})`, h[5] || 0));
  (o.dk || []).forEach(h => glow(h[0], h[1], h[2], h[3], `rgba(30,12,2,${h[4]})`, h[5] || 0));
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = o.ta ?? 0.95;
  ctx.save(); ctx.scale(o.ts || 0.5, o.ts || 0.5); ctx.fillStyle = o.fine ? SKIN_FINE : SKIN; ctx.fillRect(-3000, -3000, 6000, 6000); ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (o.mark) o.mark();
  ctx.restore();
  innerShadow(pathFn, o.ao ?? 26, 'rgba(25,10,0,.85)', 0, -(o.aoy ?? 14));
  if (o.edge !== false) innerShadow(pathFn, 10, 'rgba(20,8,0,.6)', 0, 0);
  if (o.rim !== false) innerShadow(pathFn, 8, 'rgba(255,215,160,.55)', 0, 6);
  if (o.line !== false) { ctx.beginPath(); pathFn(); ctx.strokeStyle = 'rgba(25,12,4,.55)'; ctx.lineWidth = 0.7; ctx.stroke(); }
}
// 주름: 어두운 홈 + 바로 아래 밝은 턱
function crease(pts, w = 1.6, a = 0.5) {
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 4) ctx.quadraticCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3]); };
  ctx.lineCap = 'round'; ctx.save(); ctx.translate(0.5, 1.1); path(); ctx.strokeStyle = `rgba(255,215,165,${a * 0.55})`; ctx.lineWidth = w * 0.8; ctx.stroke(); ctx.restore();
  path(); ctx.strokeStyle = `rgba(30,12,2,${a})`; ctx.lineWidth = w; ctx.stroke();
}
function claw(x, y, ang, len, w) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, -w / 2); ctx.bezierCurveTo(len * 0.5, -w * 0.9, len * 0.9, -w * 0.2, len, w * 0.9); ctx.bezierCurveTo(len * 0.6, w * 0.25, len * 0.3, w * 0.5, 0, w / 2); ctx.closePath();
  const g = ctx.createLinearGradient(0, -w, 0, w); g.addColorStop(0, '#5a4a3a'); g.addColorStop(0.45, '#1c140e'); g.addColorStop(1, '#0c0806');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,220,.45)'; ctx.lineWidth = 0.7; ctx.beginPath(); ctx.moveTo(len * 0.1, -w * 0.35); ctx.bezierCurveTo(len * 0.5, -w * 0.7, len * 0.8, -w * 0.2, len * 0.95, w * 0.6); ctx.stroke();
  ctx.restore();
}
function tooth(x, y, len, w, dir, lean) {
  ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.bezierCurveTo(x - w * 0.45, y + dir * len * 0.6, x + lean * 0.6, y + dir * len * 0.9, x + lean, y + dir * len);
  ctx.bezierCurveTo(x + w * 0.3 + lean * 0.4, y + dir * len * 0.6, x + w * 0.5, y + dir * len * 0.3, x + w / 2, y); ctx.closePath();
  const g = ctx.createLinearGradient(x, y, x, y + dir * len); g.addColorStop(0, '#b9a07a'); g.addColorStop(0.35, '#efe4c8'); g.addColorStop(1, '#fffaf0');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgba(60,40,20,.6)'; ctx.lineWidth = 0.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(x - w * 0.2, y + dir * len * 0.2); ctx.lineTo(x + lean * 0.7, y + dir * len * 0.85); ctx.stroke();
}

// ---------- 색 ----------
const BODY = ['#3a2010', '#6e3e1c', '#a8652e', '#c98a4a', '#e2b57c'];
const LIMB = ['#4a2a14', '#7c4720', '#a8682f', '#c48448'];
const FAR = ['#24130a', '#3e2412', '#5a3519', '#6e4422'];

// ---------- 다리 ----------
function leg(far, a) {
  const C = far ? FAR : LIMB, hip = [-5, -150];
  ctx.save(); ctx.translate(hip[0], hip[1]); ctx.rotate(a); ctx.translate(-hip[0], -hip[1]);
  if (far) ctx.translate(-10, 0);
  // 발가락 (뒤쪽 → 앞쪽 순)
  const toe = (bx, by, ex, ey, w) => {
    const path = () => { const dx = ex - bx, dy = ey - by, L = Math.hypot(dx, dy), nx = -dy / L * w / 2, ny = dx / L * w / 2; ctx.moveTo(bx + nx, by + ny); ctx.quadraticCurveTo((bx + ex) / 2 + nx * 1.2, (by + ey) / 2 + ny * 1.2 - 2, ex + nx * 0.6, ey + ny * 0.6); ctx.lineTo(ex - nx * 0.6, ey - ny * 0.6); ctx.quadraticCurveTo((bx + ex) / 2 - nx, (by + ey) / 2 - ny, bx - nx, by - ny); ctx.closePath(); };
    part(path, { cols: C, y0: by - w, y1: by + w, ts: 0.35, fine: 1, ao: 6, aoy: 3, mark: () => { for (let i = 1; i < 4; i++) crease([bx + (ex - bx) * i / 4, by + (ey - by) * i / 4 - w * 0.6, bx + (ex - bx) * i / 4 + 2, by + (ey - by) * i / 4, bx + (ex - bx) * i / 4, by + (ey - by) * i / 4 + w * 0.6], 0.9, 0.6); } });
    claw(ex - 1, ey - 1, Math.atan2(ey - by, ex - bx) + 0.25, w * 1.3, w * 0.8);
  };
  toe(22, -12, 50, -6, 9); toe(24, -10, 62, -3, 11); toe(20, -8, 46, -1, 10);
  // 발등(중족골)
  part(() => { ctx.moveTo(-6, -40); ctx.bezierCurveTo(2, -42, 14, -36, 20, -24); ctx.bezierCurveTo(26, -16, 34, -14, 34, -8); ctx.bezierCurveTo(26, -2, 14, -3, 8, -8); ctx.bezierCurveTo(0, -16, -10, -26, -12, -36); ctx.closePath(); },
    { cols: C, y0: -42, y1: -2, ts: 0.4, fine: 1, ao: 10, aoy: 5, mark: () => { for (let i = 0; i < 6; i++) crease([-4 + i * 6, -34 + i * 4, 2 + i * 6, -30 + i * 4, 6 + i * 6, -26 + i * 4], 0.9, 0.45); } });
  claw(-10, -30, 2.4, 7, 4);
  // 정강이
  part(() => { ctx.moveTo(8, -100); ctx.bezierCurveTo(32, -98, 36, -80, 28, -62); ctx.bezierCurveTo(20, -48, 10, -40, 4, -34); ctx.lineTo(-8, -38); ctx.bezierCurveTo(-12, -56, -18, -76, -12, -94); ctx.closePath(); },
    { cols: C, y0: -104, y1: -34, ts: 0.45, hl: [[18, -86, 18, 10, 0.35, -0.9]], ao: 16, aoy: 8, mark: () => { crease([-10, -90, -4, -70, -4, -48], 1.4, 0.45); } });
  // 허벅지 (근육 덩어리)
  part(() => { ctx.moveTo(-42, -180); ctx.bezierCurveTo(0, -196, 52, -184, 60, -152); ctx.bezierCurveTo(66, -126, 54, -100, 36, -88); ctx.bezierCurveTo(22, -80, 4, -84, -8, -96); ctx.bezierCurveTo(-26, -112, -52, -130, -64, -150); ctx.bezierCurveTo(-66, -166, -56, -178, -42, -180); ctx.closePath(); },
    { cols: far ? FAR : BODY, y0: -206, y1: -90, ts: 0.34, ta: 0.75, hl: [[16, -150, 40, 22, 0.18, -0.5], [38, -118, 16, 24, 0.12, 0.2]], ao: 30, aoy: 18, line: false, edge: false, rim: false,
      mark: () => { crease([-40, -150, -10, -128, 20, -96], 2, 0.4); crease([30, -176, 46, -150, 44, -110], 1.6, 0.3); } });
  ctx.restore();
}

// ---------- 앞발 ----------
function arm(far, a) {
  const C = far ? FAR : LIMB;
  ctx.save(); ctx.translate(98, -136); ctx.rotate(a);
  part(() => { ctx.moveTo(-6, -6); ctx.bezierCurveTo(8, -10, 16, 2, 18, 14); ctx.lineTo(10, 18); ctx.bezierCurveTo(4, 10, -4, 6, -8, 4); ctx.closePath(); }, { cols: C, y0: -10, y1: 18, ts: 0.35, fine: 1, ao: 6, aoy: 3 });
  part(() => { ctx.moveTo(12, 10); ctx.bezierCurveTo(20, 12, 28, 14, 32, 18); ctx.lineTo(30, 24); ctx.bezierCurveTo(24, 22, 16, 22, 10, 18); ctx.closePath(); }, { cols: C, y0: 10, y1: 24, ts: 0.3, fine: 1, ao: 5, aoy: 2 });
  claw(31, 18, 0.7, 7, 3); claw(29, 22, 1.2, 6, 3);
  ctx.restore();
}

// ---------- 머리 ----------
function head(jaw, hr) {
  ctx.save(); ctx.translate(114, -188); ctx.rotate(hr);
  const ja = jaw * 0.62, piv = [6, 14];
  const lipY = x => 14 - (x - 14) / 94 * 6;
  const jawPath = () => { ctx.moveTo(-12, 0); ctx.lineTo(100, -4); ctx.bezierCurveTo(104, 2, 100, 10, 92, 13); ctx.bezierCurveTo(60, 18, 30, 25, 6, 29); ctx.bezierCurveTo(-8, 29, -16, 16, -12, 0); ctx.closePath(); };
  // 입 안
  if (jaw > 0.02) {
    const tip = [piv[0] + 100 * Math.cos(ja) + 4 * Math.sin(ja), piv[1] + 100 * Math.sin(ja) - 4 * Math.cos(ja)];
    const mouth = () => { ctx.moveTo(piv[0], piv[1]); ctx.lineTo(108, 8); ctx.lineTo(tip[0], tip[1]); ctx.closePath(); };
    ctx.beginPath(); mouth(); const mg = ctx.createRadialGradient(20, 30, 4, 40, 30, 90); mg.addColorStop(0, '#1e0605'); mg.addColorStop(0.6, '#4a1210'); mg.addColorStop(1, '#7a2a24'); ctx.fillStyle = mg; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle = 'rgba(150,60,55,.5)'; ctx.lineWidth = 1.2; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(30 + i * 10, lipY(30 + i * 10) + 3); ctx.quadraticCurveTo(34 + i * 10, lipY(30 + i * 10) + 10, 30 + i * 10, lipY(30 + i * 10) + 14); ctx.stroke(); }
    ctx.save(); ctx.translate(piv[0], piv[1]); ctx.rotate(ja); const tg = ctx.createLinearGradient(0, -14, 0, 4); tg.addColorStop(0, '#d8857a'); tg.addColorStop(1, '#8a3a34');
    ctx.fillStyle = tg; ctx.beginPath(); ctx.ellipse(46, -6, 44, 8, -0.02, 0, 7); ctx.fill(); ctx.strokeStyle = 'rgba(90,20,15,.6)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(84, -7); ctx.stroke(); ctx.restore();
    ctx.restore();
    // 잇몸 + 위 이빨
    ctx.strokeStyle = '#9a4440'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(18, lipY(18) - 1); ctx.lineTo(106, lipY(106) - 1); ctx.stroke();
    const up = [[104, 4, 2.6], [99, 5, 2.8], [94, 6, 3], [88, 9, 4.2], [81, 11, 4.8], [73, 12, 5], [65, 11.5, 5], [57, 11, 4.8], [49, 10, 4.5], [41, 9, 4.2], [33, 7.5, 3.8], [26, 6, 3.2], [20, 4.5, 2.8]];
    for (const [x, l, w] of up) tooth(x, lipY(x) - 1, l, w, 1, -l * 0.18);
  }
  // 아래턱
  ctx.save(); ctx.translate(piv[0], piv[1]); ctx.rotate(ja);
  if (jaw > 0.02) { const lo = [[92, 6, 3], [85, 8, 3.8], [77, 9, 4.2], [69, 9.5, 4.4], [61, 9, 4.2], [53, 8.5, 4], [45, 8, 3.8], [37, 7, 3.4], [29, 6, 3], [21, 4.5, 2.6]]; for (const [x, l, w] of lo) tooth(x, -4 + (100 - x) * -0.0, l, w, -1, -l * 0.15); }
  part(jawPath, { cols: ['#5a3018', '#8a4e24', '#c08048', '#e0b07a'], y0: -4, y1: 29, ts: 0.3, fine: 1, ao: 10, aoy: 5,
    hl: [[10, 14, 18, 10, 0.4]], mark: () => {
      for (let i = 0; i < 16; i++) { const x = 8 + i * 5.8; ctx.fillStyle = i % 2 ? 'rgba(255,220,170,.22)' : 'rgba(40,18,4,.25)'; ctx.beginPath(); ctx.ellipse(x, 1.5 + i * -0.02, 2.6, 1.8, 0, 0, 7); ctx.fill(); }
      crease([4, 10, 30, 16, 60, 13], 1, 0.35); crease([0, 18, 20, 24, 44, 22], 1, 0.3);
    } });
  ctx.restore();
  // 두개골
  const skull = () => { ctx.moveTo(-14, -14); ctx.bezierCurveTo(-6, -34, 20, -42, 44, -40); ctx.bezierCurveTo(60, -39, 80, -32, 100, -20); ctx.bezierCurveTo(108, -15, 112, -6, 111, 2); ctx.lineTo(108, 8); ctx.bezierCurveTo(80, 10, 40, 10, 14, 14); ctx.lineTo(4, 20); ctx.bezierCurveTo(-8, 22, -18, 12, -18, 0); ctx.closePath(); };
  part(skull, { cols: ['#3a1e0c', '#6a3a1a', '#9c5c2a', '#c88a50'], y0: -42, y1: 14, ts: 0.3, fine: 1, ao: 12, aoy: 6,
    hl: [[8, -14, 22, 16, 0.45], [30, -4, 18, 8, 0.35], [56, -38, 14, 5, 0.5], [86, -24, 18, 6, 0.3, 0.4]],
    dk: [[76, -12, 20, 8, 0.45, 0.15], [50, -20, 12, 9, 0.5]],
    mark: () => {
      for (let i = 0; i < 12; i++) { const x = 62 + i * 3.4, y = -33 + i * 1.5 + Math.sin(i * 1.7) * 1.5; glow(x, y, 2.6, 2.2, 'rgba(255,215,170,.55)'); glow(x + 0.6, y + 1.6, 2.4, 1.6, 'rgba(30,12,2,.45)'); }
      for (let i = 0; i < 16; i++) { const x = 22 + i * 5.4; ctx.fillStyle = i % 2 ? 'rgba(255,220,170,.25)' : 'rgba(40,18,4,.25)'; ctx.beginPath(); ctx.ellipse(x, lipY(x) - 3.2, 2.7, 2, 0, 0, 7); ctx.fill(); }
      crease([-10, -8, 0, -2, 4, 12], 1.4, 0.5); crease([-4, -20, 6, -12, 10, 4], 1.2, 0.45);
      crease([36, -10, 44, -4, 58, -6], 1, 0.4); crease([40, -30, 50, -26, 62, -30], 1, 0.35);
      crease([6, 12, 2, 6, -4, 0], 1.2, 0.5); crease([14, 12, 10, 4, 4, -4], 1, 0.4);
    } });
  // 눈썹뼈·눈물뼈 돌기
  part(() => { ctx.ellipse(52, -34, 13, 5, -0.15, 0, 7); }, { cols: ['#5a3418', '#8a5428', '#a86a34'], y0: -40, y1: -29, ts: 0.25, fine: 1, ao: 4, aoy: 3, line: false });
  part(() => { ctx.ellipse(68, -35, 7, 3.5, -0.2, 0, 7); }, { cols: ['#5a3418', '#8a5428', '#a86a34'], y0: -39, y1: -31, ts: 0.25, fine: 1, ao: 3, aoy: 2, line: false });
  // 눈
  glow(50, -22, 12, 9, 'rgba(15,5,0,.85)');
  ctx.beginPath(); ctx.ellipse(50, -22, 4.2, 3.4, -0.1, 0, 7); const eg = ctx.createRadialGradient(49, -23, 0.4, 50, -22, 4.2);
  eg.addColorStop(0, '#fff2a0'); eg.addColorStop(0.45, '#e8a81c'); eg.addColorStop(0.85, '#8a4a08'); eg.addColorStop(1, '#3a1a02'); ctx.fillStyle = eg; ctx.fill();
  ctx.fillStyle = '#080402'; ctx.beginPath(); ctx.ellipse(50.3, -22, 1.3, 2.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(48.8, -23.4, 0.7, 0, 7); ctx.fill();
  crease([43, -26, 50, -29, 57, -25], 1.4, 0.7); crease([44, -17, 50, -15, 56, -18], 1, 0.5);
  // 콧구멍
  glow(100, -12, 4, 2.6, 'rgba(10,4,0,.85)', 0.4); crease([96, -15, 100, -16, 104, -13], 0.8, 0.5);
  ctx.restore();
}

// ---------- 전체 ----------
function trex(p) {
  leg(true, 0.2); arm(true, p.arm - 0.1);
  const body = () => {
    ctx.moveTo(-252, -168); ctx.bezierCurveTo(-180, -188, -90, -202, -20, -201); ctx.bezierCurveTo(30, -201, 60, -190, 82, -188);
    ctx.bezierCurveTo(98, -188, 108, -198, 122, -206); ctx.lineTo(134, -176);
    ctx.bezierCurveTo(132, -150, 120, -132, 104, -122); ctx.bezierCurveTo(88, -102, 60, -90, 30, -90); ctx.bezierCurveTo(5, -90, -22, -104, -46, -122);
    ctx.bezierCurveTo(-100, -146, -170, -160, -252, -162); ctx.closePath();
  };
  part(body, { cols: BODY, y0: -206, y1: -90, ts: 0.34, ta: 0.7, ao: 34, aoy: 18,
    hl: [[20, -176, 90, 26, 0.45, -0.05], [-120, -172, 90, 12, 0.35, -0.12], [96, -170, 22, 26, 0.35, -0.4]],
    dk: [[60, -112, 60, 18, 0.25]],
    mark: () => {
      ctx.lineCap = 'round';
      for (let i = 0; i < 14; i++) { const x = -220 + i * 23, top = x < -20 ? -168 - (x + 252) / 232 * 32 : -201 + (x + 20) / 102 * 13; ctx.strokeStyle = 'rgba(35,15,4,.32)'; ctx.lineWidth = 9 - Math.abs(i - 9) * 0.5; ctx.beginPath(); ctx.moveTo(x, top - 2); ctx.quadraticCurveTo(x - 4, top + 14, x - 12, top + 28); ctx.stroke(); }
      for (let i = 0; i < 9; i++) crease([92 + i * 3, -190 + i * 2, 100 + i * 3, -165, 96 + i * 4, -130 + i * 1.5], 1.3, 0.38);
      for (let i = 0; i < 7; i++) crease([18 + i * 12, -98, 22 + i * 12, -92, 26 + i * 12, -90], 1, 0.3);
      const Rm = rng(21); for (let i = 0; i < 40; i++) { const x = -240 + Rm() * 370, y = -195 + Rm() * 100; glow(x, y, 6 + Rm() * 14, 4 + Rm() * 8, Rm() < 0.55 ? 'rgba(40,18,4,.22)' : 'rgba(255,210,150,.16)', Rm() * 3); }
      for (let i = 0; i < 10; i++) { const x = -40 + i * 12; crease([x, -150 + i * 2, x + 6, -130, x + 2, -106 + i], 1, 0.22); }
      for (let i = 0; i < 6; i++) crease([60 + i * 6, -182, 66 + i * 6, -160, 62 + i * 7, -134], 1, 0.25);
      crease([-120, -158, -60, -138, -30, -112], 1.6, 0.3); crease([40, -170, 70, -150, 80, -118], 1.4, 0.3);
    } });
  head(p.jaw, p.hr);
  leg(false, -0.06);
  arm(false, p.arm);
}

// ---------- 배경: 안개 낀 숲 (흐림 효과는 그림자 블러로) ----------
function blurShape(fn, blur, col) { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetX = 5000; ctx.translate(-5000, 0); ctx.fillStyle = col; ctx.beginPath(); fn(); ctx.fill(); ctx.restore(); }
function background() {
  const g = ctx.createRadialGradient(CW * 0.5, CH * 0.38, 50, CW * 0.5, CH * 0.45, CW * 0.75);
  g.addColorStop(0, '#6fae86'); g.addColorStop(0.35, '#2f6a4a'); g.addColorStop(1, '#0a1c12'); ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  const R = rng(4);
  for (let i = 0; i < 14; i++) { const x = R() * CW, w = 30 + R() * 90; blurShape(() => ctx.rect(x, -50, w, CH + 100), 30 + R() * 30, `rgba(${10 + R() * 20},${30 + R() * 25},${20 + R() * 15},${0.5 + R() * 0.4})`); }
  for (let i = 0; i < 4; i++) { const x = [80, 240, 1330, 1500][i], w = [150, 90, 110, 170][i]; blurShape(() => { ctx.moveTo(x, -50); ctx.lineTo(x + w, -50); ctx.lineTo(x + w * 1.15, CH); ctx.lineTo(x - w * 0.2, CH); }, 14, 'rgba(8,20,12,.92)'); }
  for (let i = 0; i < 26; i++) blurShape(() => ctx.ellipse(R() * CW, CH * (0.6 + R() * 0.25), 80 + R() * 160, 30 + R() * 50, 0, 0, 7), 40, `rgba(${40 + R() * 30},${90 + R() * 40},${50 + R() * 20},.45)`);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 5; i++) { const a = 1.25 + i * 0.12; ctx.fillStyle = 'rgba(200,255,210,.05)'; ctx.beginPath(); ctx.moveTo(CW * 0.45, -40); ctx.lineTo(CW * 0.45 + Math.cos(a) * 1600, Math.sin(a) * 1600); ctx.lineTo(CW * 0.45 + Math.cos(a + 0.05) * 1600, Math.sin(a + 0.05) * 1600); ctx.fill(); }
  ctx.restore();
  const gg = ctx.createLinearGradient(0, CH * 0.78, 0, CH); gg.addColorStop(0, 'rgba(30,50,25,0)'); gg.addColorStop(0.3, '#2a3a1c'); gg.addColorStop(1, '#141c0c'); ctx.fillStyle = gg; ctx.fillRect(0, CH * 0.78, CW, CH * 0.22);
  blurShape(() => ctx.rect(0, CH * 0.62, CW, 120), 60, 'rgba(190,230,200,.18)');
}
function groundShadow(x, y, w) { blurShape(() => ctx.ellipse(x, y, w, w * 0.07, 0, 0, 7), 30, 'rgba(0,0,0,.6)'); }

// ---------- 그리기 ----------
background();
const S = 2.45, ox = 840, oy = 900;
groundShadow(ox + 20, oy + 6, 260 * S / 2.45 * 1.0 + 200);
ctx.save(); ctx.translate(ox, oy); ctx.scale(S, S); trex({ jaw: 1, hr: -0.14, arm: 0.25 }); ctx.restore();
// 게임 크기 미리보기 (입 다문 기본 자세)
ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(1180, 40, 380, 230, 16) : ctx.rect(1180, 40, 380, 230); ctx.fill();
ctx.save(); ctx.translate(1385, 240); ctx.scale(0.72, 0.72); trex({ jaw: 0, hr: 0, arm: 0 }); ctx.restore();
ctx.font = "bold 18px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.textAlign = 'center'; ctx.fillText('실제 게임 크기 (기본 자세)', 1370, 262);
ctx.font = "bold 30px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif"; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText('티라노사우루스 · 새 디자인 시안', 48, 70);
ctx.font = "18px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('포효 자세 · 비늘 질감, 근육 음영, 주름, 이빨 디테일', 48, 102);
